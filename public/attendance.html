<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance — PayrollPro</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="layout">
  <aside id="sidebar" class="sidebar"></aside>
  <main class="main">
    <div class="page-header">
      <h1>Attendance</h1>
      <p class="page-subtitle">Log working hours and view records</p>
    </div>

    <div class="card section">
      <div class="card-title">Log Hours</div>
      <div class="form-grid">
        <div class="form-group" id="empSelectGroup" style="display:none;">
          <label for="attEmp">Employee</label>
          <select id="attEmp"><option value="">Loading…</option></select>
        </div>
        <div class="form-group">
          <label for="attDate">Date</label>
          <input id="attDate" type="date">
        </div>
        <div class="form-group">
          <label for="attHours">Hours Worked</label>
          <input id="attHours" type="number" min="0" max="24" step="0.5" placeholder="e.g. 8.5">
        </div>
      </div>
      <div class="form-actions" style="margin-top:14px;">
        <button class="btn btn-primary" onclick="logAttendance()">Log Attendance</button>
      </div>
    </div>

    <div class="section">
      <div class="section-header">
        <span class="section-title">Attendance Records</span>
        <div id="adminFilter" style="display:none;">
          <select id="filterEmp" onchange="loadRecords()" style="width:auto;">
            <option value="">Select employee…</option>
          </select>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Date</th><th>Hours Worked</th><th>Logged</th></tr></thead>
          <tbody id="attTable"><tr class="loading-row"><td colspan="3">Select an employee or log in as staff to view records.</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
</div>
<script src="/js/api.js"></script>
<script src="/js/attendance.js"></script>
</body>
</html>
