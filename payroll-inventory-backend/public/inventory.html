<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory — PayrollPro</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="layout">
  <aside id="sidebar" class="sidebar"></aside>
  <main class="main">
    <div class="page-header">
      <h1>Inventory</h1>
      <p class="page-subtitle">Record stock movements and view transaction history</p>
    </div>

    <div class="card section">
      <div class="card-title">Record Transaction</div>
      <div class="form-grid">
        <div class="form-group">
          <label for="txnProduct">Product</label>
          <select id="txnProduct"><option value="">Loading products…</option></select>
        </div>
        <div class="form-group">
          <label for="txnReason">Reason</label>
          <select id="txnReason">
            <option value="restock">Restock (add stock)</option>
            <option value="sale">Sale (remove stock)</option>
            <option value="damage">Damage (remove stock)</option>
            <option value="adjustment">Adjustment</option>
          </select>
        </div>
        <div class="form-group">
          <label for="txnAmt">Quantity (positive = add, negative = remove)</label>
          <input id="txnAmt" type="number" placeholder="e.g. 50 or -5" step="1">
        </div>
      </div>
      <div class="form-actions" style="margin-top:14px;">
        <button class="btn btn-primary" onclick="recordTransaction()">Record Transaction</button>
      </div>
      <div id="txnResult" style="margin-top:16px;"></div>
    </div>

    <div class="section">
      <div class="section-header">
        <span class="section-title">Transaction Log</span>
        <select id="filterProduct" onchange="loadTransactions()" style="width:auto;background:var(--surface);border:1px solid var(--border);color:var(--text-primary);padding:7px 10px;border-radius:var(--radius-sm);font-size:13px;">
          <option value="">All Products</option>
        </select>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Product</th><th>Change</th><th>Reason</th><th>New Stock</th><th>Date</th></tr></thead>
          <tbody id="txnTable"><tr class="loading-row"><td colspan="5">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
</div>
<script src="/js/api.js"></script>
<script src="/js/inventory.js"></script>
</body>
</html>
